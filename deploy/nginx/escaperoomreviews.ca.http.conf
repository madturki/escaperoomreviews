# escaperoomreviews.ca — static Astro site (HTTP only). Used before a certificate exists,
# e.g. for testing over the LAN with an /etc/hosts override. Rendered by deploy/server-setup.sh.

server {
    listen 80;
    listen [::]:80;
    server_name escaperoomreviews.ca www.escaperoomreviews.ca;

    include __SITE_ROOT__/nginx/site-common.conf;
}
