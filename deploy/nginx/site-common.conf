# Shared static-site rules for escaperoomreviews.ca. Included from the server block(s).
# __SITE_ROOT__ is replaced by deploy/server-setup.sh.

root __SITE_ROOT__/site;
index index.html;
charset utf-8;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml;

# WordPress URL redirects (generated by scripts/import-wp)
include __SITE_ROOT__/nginx/redirects.conf;

location ^~ /.well-known/acme-challenge/ {
    default_type text/plain;
}

# There is no PHP or WordPress here any more; tell bots the old endpoints are gone.
location ~* \.php$ {
    return 410;
}

location ~* ^/(wp-admin|wp-includes|wp-content|wp-json|xmlrpc|cgi-bin)(/|$) {
    return 410;
}

location ~ /\. {
    return 404;
}

location /_astro/ {
    expires max;
    access_log off;
}

location /images/ {
    expires 30d;
    access_log off;
}

location /pagefind/ {
    expires 1h;
}

location / {
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;
error_page 410 /404.html;
