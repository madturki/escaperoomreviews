# escaperoomreviews.ca — static Astro site (HTTPS). Rendered by deploy/server-setup.sh.
# Canonical host is www.escaperoomreviews.ca (matches the old WordPress siteurl).

server {
    listen 80;
    listen [::]:80;
    server_name escaperoomreviews.ca www.escaperoomreviews.ca;

    location ^~ /.well-known/acme-challenge/ {
        root __SITE_ROOT__/site;
        default_type text/plain;
    }

    location / {
        return 301 https://www.escaperoomreviews.ca$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name escaperoomreviews.ca;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:escaperoomreviews_ssl:10m;

    return 301 https://www.escaperoomreviews.ca$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.escaperoomreviews.ca;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:escaperoomreviews_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include __SITE_ROOT__/nginx/site-common.conf;
}
